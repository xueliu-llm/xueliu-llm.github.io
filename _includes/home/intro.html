<section class="apple-intro" id="about" aria-label="Introduction">
  <h1 class="main-heading">
    <span class="greeting-lead">
      <span>Hi there</span>
      <img class="intro-wave" src="{{ '/images/Hi.gif' | relative_url }}" width="32" height="32" alt="">
    </span>
    <span class="greeting-message">Welcome to my Homepage!</span>
  </h1>

  <div class="hero-bio">
    {{ site.data.profile.intro_html }}
  </div>

  {% if site.data.profile.interests.size > 0 %}
  <div class="research-interests" role="group" aria-labelledby="research-interests-label">
    <span class="research-caption" id="research-interests-label">Research Interests</span>
    <div class="research-tags">
      {% for interest in site.data.profile.interests %}
      <span class="research-topic">{{ interest | escape }}</span>
      {% endfor %}
    </div>
  </div>
  {% endif %}
</section>
